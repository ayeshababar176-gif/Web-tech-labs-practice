<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- top margin 5 or from ko ek container ma rkh dya -->
    <div class="container mt-5">
    <form>
        <div class="mb-3">
        <label for="name">name:</label>
        <input type="text" name="name" id="name" class="form-control" placeholder="Enter your name">
        </div>

        <div class="mb-3">
        <label for="email">email:</label>
        <input type="email" name="email" id="email" class="form-control" placeholder="Enter ur email">
    </div>

    <div class="mb-3">
        <label for="categories">Categories</label>
        <select class="form-select">
            <option value="food">food</option>
            <option value="fashion">fashion</option>
            <option value="dessert">dessert</option>
            <option value="formal">formal</option>
        </select></div>

        <div div class="mb-3">
        <label for="subjects">subjects</label>
        <input list="sub" name="subject" class="form-control" id="subject">
        <datalist id="sub">
            <option value="OS">Os</option>
            <option value="SE">SE</option>
            <option value="Web">Web</option>
        </datalist></div>

        <button class="btn btn-primary" >Submitt Details</button><br>

        <label for="italic">Italic</label>
        <input type="checkbox" name="writing" id="italic" value="italic">

       <label for="bold">Bold</label>
       <input type="checkbox" name="writing" id="bold" value="bold">

       <label for="underline">Underline</label>
       <input type="checkbox" name="underline" id="underline" value="underline">
     
    </form>
    </div>
    
</body>
</html>
