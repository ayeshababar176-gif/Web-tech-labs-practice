  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Useful Links</title>
</head>
<body>

    <!-- Top anchor for the "Back to top" link -->
    <h1 id="top">Useful Links</h1>

    <!-- In-page link that jumps down to the Gallery section -->
    <p><a href="#gallery">Jump to Gallery</a></p>

    <ul>
        <!-- External link opening in a new tab -->
        <li><a href="https://developer.mozilla.org" target="_blank">MDN Web Docs</a></li>
        <!-- Relative link to course.html from Task 1 -->
        <li><a href="course.html">Course Page</a></li>
        <!-- E-mail link -->
        <li><a href="mailto:weblab@example.com">Email the instructor</a></li>
    </ul>

    <h2 id="gallery">Gallery</h2>

    <div>
        <!-- Image with alt text and width (adjust src path/filename as needed) -->
        <img src="campus.jpg" alt="Campus" width="400">
        <p>Our campus</p>
    </div>

    <!-- In-page link that jumps back to the top -->
    <p><a href="#top">Back to top</a></p>

</body>
</html>
