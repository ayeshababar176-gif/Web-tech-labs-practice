<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Booking Form</title>
</head>
<body>

    <form action="#" method="get">
        <fieldset style="width: 350px;">
            <legend>Book Your Seat</legend>

            <!-- Event Date Field (Accepts future dates only) -->
            <p>
                <label for="event-date">Event date:</label>
                <input type="date" id="event-date" name="event-date" min="2026-10-17" required>
            </p>

            <!-- Seats Field (Between 1 and 5) -->
            <p>
                <label for="seats">Seats (1-5):</label>
                <input type="number" id="seats" name="seats" min="1" max="5" required>
            </p>

            <!-- Phone Field (Format: 03XXXXXXXXX) -->
            <p>
                <label for="phone">Phone:</label>
                <input type="text" id="phone" name="phone" pattern="03[0-9]{9}" placeholder="03XXXXXXXXX" required>
            </p>

            <!-- Notes Field -->
            <p>
                <label for="notes">Notes:</label><br>
                <textarea id="notes" name="notes" rows="3" cols="30"></textarea>
            </p>

            <!-- Action Buttons (Book & Clear) -->
            <p>
                <button type="submit">Book</button>
                <button type="reset">Clear</button>
            </p>
        </fieldset>
    </form>

</body>
</html>
