<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <form action="#" method="post">
        
        <!-- Fieldset 1: Personal Information -->
        <fieldset>
            <legend>Personal Information</legend>

            <!-- Full Name -->
            <p>
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>
            </p>

            <!-- Father Name -->
            <p>
                <label for="fathername">Father Name:</label>
                <input type="text" id="fathername" name="fathername" required>
            </p>

            <!-- Date of Birth -->
            <p>
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>
            </p>

            <!-- Gender -->
            <p>
                Gender:
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
            </p>

            <!-- CNIC (Pattern: #####-#######-#) -->
            <p>
                <label for="cnic">CNIC:</label>
                <input type="text" id="cnic" name="cnic" placeholder="#####-#######-#" pattern="[0-9]{5}-[0-9]{7}-[0-9]{1}" title="Format: #####-#######-#" required>
            </p>

            <!-- Photo (Images only) -->
            <p>
                <label for="photo">Photo:</label>
                <input type="file" id="photo" name="photo" accept="image/*" required>
            </p>
        </fieldset>

        <br>

        <!-- Fieldset 2: Academic Information -->
        <fieldset>
            <legend>Academic Information</legend>

            <!-- Roll Number (Pattern: FA23-BSCS-001) -->
            <p>
                <label for="rollno">Roll Number:</label>
                <input type="text" id="rollno" name="rollno" placeholder="FA23-BSCS-001" pattern="[A-Z]{2}[0-9]{2}-[A-Z]{4}-[0-9]{3}" title="Format: FA23-BSCS-001" required>
            </p>

            <!-- Program Select -->
            <p>
                <label for="program">Program:</label>
                <select id="program" name="program" required>
                    <option value="">--Select Program--</option>
                    <option value="BSCS">BS Computer Science</option>
                    <option value="BSSE">BS Software Engineering</option>
                    <option value="BSIT">BS Information Technology</option>
                </select>
            </p>

            <!-- Semester (Number 1-8) -->
            <p>
                <label for="semester">Semester (1-8):</label>
                <input type="number" id="semester" name="semester" min="1" max="8" required>
            </p>

            <!-- Courses Checkboxes -->
            <p>
                Courses:
                <input type="checkbox" id="course1" name="courses" value="Web Programming">
                <label for="course1">Web Programming</label>

                <input type="checkbox" id="course2" name="courses" value="Database Systems">
                <label for="course2">Database Systems</label>

                <input type="checkbox" id="course3" name="courses" value="Data Structures">
                <label for="course3">Data Structures</label>
            </p>
        </fieldset>

        <br>

        <!-- Fieldset 3: Contact Information -->
        <fieldset>
            <legend>Contact Information</legend>

            <!-- Email -->
            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </p>

            <!-- Phone (Pattern: 03#########) -->
            <p>
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" placeholder="03XXXXXXXXX" pattern="03[0-9]{9}" title="Format: 03#########" required>
            </p>

            <!-- Address -->
            <p>
                <label for="address">Address:</label><br>
                <textarea id="address" name="address" rows="3" cols="30" required></textarea>
            </p>

            <!-- Agree to Terms -->
            <p>
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree to the terms and conditions</label>
            </p>
        </fieldset>

        <br>

        <!-- Submit and Reset Buttons -->
        <p>
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </p>

    </form>

</body>
</html>
